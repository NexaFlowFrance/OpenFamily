<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — OpenFamily</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/openfamily-og.png" />
  <style>
    /* Self-contained on purpose: a 404 page must never depend on an asset that
       could itself be missing. */
    :root { --bg:#f7f2e9; --surface:#fcfaf5; --border:#e7dccc; --text:#2a2028; --muted:#6e5f66; --primary:#dc4a60; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center;
    }
    .code { font-size: 4rem; font-weight: 700; color: var(--primary); letter-spacing: -0.03em; }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0.35rem 0 0.5rem; }
    p { color: var(--muted); max-width: 30rem; margin: 0 auto 1.75rem; }
    .actions { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; }
    a {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      padding: 0.65rem 1.35rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem;
    }
    .primary { background: var(--primary); color: #fff; }
    .secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
    .lang { margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted); }
    .lang a { padding: 0; background: none; border: none; color: var(--primary); font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be outdated, or the address mistyped. Everything about OpenFamily is on the home page.</p>
    <div class="actions">
      <a class="primary" href="/">Back to the home page</a>
      <a class="secondary" href="/demo/">Try the live demo</a>
    </div>
    <p class="lang">Vous cherchiez la version française ? <a href="/fr">Aller à openfamily.fr/fr</a></p>
  </main>
</body>
</html>
