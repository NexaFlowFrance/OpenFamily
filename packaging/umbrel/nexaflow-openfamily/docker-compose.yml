version: "3.7"

services:

  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: nexaflow-openfamily_app_1
      APP_PORT: 3000
      # OpenFamily has its own accounts. Its Android app, its calendar feeds
      # and the programs that use its API cannot sign in to Umbrel first.
      PROXY_AUTH_ADD: "false"

  app:
    # The web interface, the API and PostgreSQL in one container. Its secrets
    # are generated on the first start and kept in /data.
    image: ghcr.io/nexaflowfrance/openfamily:2.1.0@sha256:2f2f87bd968140668281df7798e8d7b819f9afd5604fbe64f3bf2d09d0d0f18b
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
