# OpenFamily for CasaOS (BigBearCasaOS format)
#
# One container: the web interface, the API and PostgreSQL. Nothing to edit
# before installing: the secrets are generated on the first start and kept in
# the data folder.

# Name of the big-bear-openfamily application
name: big-bear-openfamily
# Service definitions for the big-bear-openfamily application
services:
  # Service name: big-bear-openfamily
  big-bear-openfamily:
    # Name of the container
    container_name: big-bear-openfamily
    # Image to be used for the container
    image: ghcr.io/nexaflowfrance/openfamily:2.1.0
    # Container restart policy
    restart: unless-stopped
    # Environment variables for the container
    environment:
      # true lets anyone who reaches the app create an account. Set it to
      # false once yours exists: people invited from the Family page still can.
      - REGISTRATION_ENABLED=true
    # Volumes to be mounted to the container
    volumes:
      # The database and the secrets generated on the first start
      - /DATA/AppData/$AppID/data:/data
    # Ports mapping between host and container
    ports:
      # Web interface, API and live updates
      - "8480:3000"
    x-casaos:
      # Descriptions for the environment variables
      envs:
        - container: REGISTRATION_ENABLED
          description:
            en_us: "true lets anyone create an account. Set to false once yours exists: invited people still can."
            fr_fr: "true laisse n'importe qui créer un compte. Passez à false une fois le vôtre créé : les personnes invitées le peuvent toujours."
      # Descriptions for the volumes
      volumes:
        - container: /data
          description:
            en_us: "Container Path: /data (database and generated secrets, the folder to back up)"
            fr_fr: "Chemin du conteneur : /data (base de données et secrets générés, le dossier à sauvegarder)"
      # Descriptions for the ports
      ports:
        - container: "3000"
          description:
            en_us: "Container Port: 3000 (web interface and API)"
            fr_fr: "Port du conteneur : 3000 (interface web et API)"

# CasaOS specific configuration
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
    - arm64
  # Main service for this application
  main: big-bear-openfamily
  # Detailed description for the application
  description:
    en_us: OpenFamily keeps the whole household organized from your own server. Shared family calendar with reminders and iCal feed, tasks and chores with a points and rewards system for kids, collaborative shopping lists with live updates, weekly meal planning with a recipe book and recipe import, family budget tracking, a wall-mounted kiosk mode and an optional AI assistant. Android app, documented API with webhooks, interface in eight languages. Integrates with Home Assistant, Gladys Assistant, Mealie, Tandoor, Grocy and Nextcloud (CalDAV).
    fr_fr: OpenFamily organise toute la famille depuis votre propre serveur. Calendrier familial partagé avec rappels et flux iCal, tâches et corvées avec un système de points et de récompenses pour les enfants, listes de courses collaboratives mises à jour en direct, planification des repas avec livre de recettes et import de recettes, budget familial, mode kiosque pour tablette murale et assistant IA optionnel. Application Android, API documentée avec webhooks, interface en huit langues. S'intègre avec Home Assistant, Gladys Assistant, Mealie, Tandoor, Grocy et Nextcloud (CalDAV).
  # Brief tagline for the application
  tagline:
    en_us: Family organizer - calendar, chores and rewards, shopping, meals, budget
    fr_fr: Organiseur familial - calendrier, corvées et récompenses, courses, repas, budget
  # Developer's information
  developer: NexaFlowFrance
  # Author of this particular configuration
  author: NexaFlowFrance
  # Icon URL for the application
  icon: https://raw.githubusercontent.com/NexaFlowFrance/OpenFamily/main/client/public/OpenFamily.png
  # Thumbnail image for the application (if any)
  thumbnail: ""
  # Installation tips
  tips:
    before_install:
      en_us: |
        Nothing to configure: open the web UI after the first start and create your account.
        It becomes the owner of a new family. Then set REGISTRATION_ENABLED to false
        in the app settings so that only people you invite can join.
        Project: https://github.com/NexaFlowFrance/OpenFamily
      fr_fr: |
        Rien à configurer : ouvrez l'interface web après le premier démarrage et créez votre compte.
        Il devient le propriétaire d'une nouvelle famille. Passez ensuite REGISTRATION_ENABLED
        à false dans les réglages de l'application pour que seules les personnes invitées puissent rejoindre.
        Projet : https://github.com/NexaFlowFrance/OpenFamily
  # Title for the application
  title:
    en_us: OpenFamily
  # Category under which the application falls
  category: BigBearCasaOS
  # Default port mapping for the application
  port_map: "8480"
