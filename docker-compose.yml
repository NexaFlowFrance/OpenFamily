version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: openfamily-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openfamily
      POSTGRES_USER: openfamily
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openfamily_secure_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfamily"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenFamily Application
  app:
    image: nexaflow/openfamily:latest
    container_name: openfamily-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://openfamily:${DB_PASSWORD:-openfamily_secure_2026}@postgres:5432/openfamily
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data

volumes:
  postgres_data:
    driver: local
  app_data:
    driver: local
