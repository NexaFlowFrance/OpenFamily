# OpenFamily client - Runtipi packaging override.
#
# Replaces the stock /etc/nginx/conf.d/default.conf of the published
# ghcr.io/nexaflowfrance/openfamily-client image so that:
#   1. /api, /ws and /health are proxied to the openfamily-server service,
#      making the whole app same-origin (works from any device, any hostname).
#   2. The absolute http://localhost:3001 API/WS URLs baked into the published
#      client bundle at build time are rewritten to same-origin ("").
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Rewrite build-time absolute URLs to same-origin so the proxy below is used.
    sub_filter_types application/javascript text/javascript;
    sub_filter_once off;
    sub_filter 'http://localhost:3001' '';
    sub_filter 'ws://localhost:3001' '';

    # REST API
    location /api/ {
        proxy_pass http://openfamily-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server health endpoint
    location = /health {
        proxy_pass http://openfamily-server:3001;
    }

    # WebSocket (live updates)
    location /ws {
        proxy_pass http://openfamily-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker must never be cached (exact match so it beats the regex above)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
        access_log off;
    }
}
